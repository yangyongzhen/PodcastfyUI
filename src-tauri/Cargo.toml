[package]
name = "podcastfyui"
version = "0.1.0"
description = "Podcastfy UI — open-source NotebookLM-style podcast generator (Tauri + Rust)"
authors = ["you"]
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "podcastfyui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
futures = "0.3"
async-trait = "0.1"

# http
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# 豆包（火山引擎）TTS：WebSocket 二进制接口客户端（wss，rustls）
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
# 豆包 TTS 协议帧的 gzip 压缩 / 解压
flate2 = "1"

# utils
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
base64 = "0.22"
url = "2"
html-escape = "0.2"

# web extraction
scraper = "0.22"
readability = "0.3"

# pdf extraction
pdf-extract = "0.10"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
